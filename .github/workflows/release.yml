name: Release Pipeline - SchemaLens Desktop

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:
    inputs:
      manual_version:
        description: 'Versão manual explícita (opcional, ex: 1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-publish:
    name: Build & Publish Release
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust Nightly Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Frontend Dependencies
        run: npm --prefix frontend ci

      - name: Build Frontend Assets
        run: npm --prefix frontend run build

      - name: Run Tests
        run: |
          cargo test --workspace --exclude schema-reader
          cargo test -p schema-reader --lib

      - name: Compile Release Desktop Binary
        run: cargo build --release -p schema-lens-desktop

      - name: Determine Version & Generate Release Notes
        id: semver
        shell: powershell
        run: |
          $explicitVersion = "${{ github.event.inputs.manual_version }}"
          $refName = "${{ github.ref_name }}"
          
          # 1. Se foi disparado por tag Git (ex: v1.0.0), extrai a versão da tag
          if ("${{ github.ref_type }}" -eq "tag" -and $refName -match '^v?(\d+\.\d+\.\d+.*)$') {
            $targetVersion = $Matches[1]
          } elseif ($explicitVersion -ne "") {
            $targetVersion = $explicitVersion.TrimStart('v')
          } else {
            # 2. Extrai a versão real do Cargo.toml ou tauri.conf.json
            if (Test-Path "src-tauri/Cargo.toml") {
              $cargoContent = Get-Content "src-tauri/Cargo.toml" -Raw
              if ($cargoContent -match 'version\s*=\s*"([^"]+)"') {
                $targetVersion = $Matches[1]
              } else {
                $targetVersion = "1.0.0"
              }
            } else {
              $targetVersion = "1.0.0"
            }
          }

          $tag = "v$targetVersion"
          Write-Host "Target Version: $targetVersion (Tag: $tag)"
          echo "version=$targetVersion" >> $env:GITHUB_OUTPUT
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

          # Gera notas de release a partir do histórico de commits
          $notes = @"
          ## SchemaLens $tag
          
          Release automatizada da aplicação desktop SchemaLens para Windows.

          ### Componentes e Artefatos:
          - Binário nativo compilado para Windows 64-bit (x86_64-pc-windows-msvc)
          - Frontend Angular 19 integrado via WebView2
          - Introspecção estritamente somente leitura de catálogos SQL Server
          - Diagramas relacionais ER interativos com Cytoscape.js
          - Análise defensiva de dependências e risco operacional

          ### Checksums de Integridade (SHA-256):
          Consulte o arquivo `build-manifest.json` anexado.
          "@
          Set-Content -Path "release-notes.md" -Value $notes

      - name: Generate Build Manifest and SHA-256
        shell: powershell
        run: |
          $binPath = "target\release\schema-lens-desktop.exe"
          $hash = (Get-FileHash -Path $binPath -Algorithm SHA256).Hash
          $manifest = @{
            Application = "SchemaLens"
            Version = "${{ steps.semver.outputs.version }}"
            Tag = "${{ steps.semver.outputs.tag }}"
            CommitSha = "${{ github.sha }}"
            BuildDateUtc = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            Target = "x86_64-pc-windows-msvc"
            Artifacts = @(
              @{
                Name = "schema-lens-desktop.exe"
                Sha256 = $hash
              }
            )
          } | ConvertTo-Json -Depth 4
          Set-Content -Path "target\release\build-manifest.json" -Value $manifest

      - name: Create Git Tag and GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.semver.outputs.tag }}
          name: SchemaLens ${{ steps.semver.outputs.tag }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            target/release/schema-lens-desktop.exe
            target/release/build-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
