<header class="app-header">
  <div class="brand-group">
    <button 
      type="button" 
      class="sidebar-toggle-btn" 
      (click)="toggleSidebar()" 
      [title]="sidebarCollapsed ? 'Expandir Painel Lateral' : 'Recolher Painel Lateral'">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
    <svg class="brand-logo" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
      <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
      <line x1="12" y1="22.08" x2="12" y2="12"></line>
    </svg>
    <span class="brand-name">SchemaLens</span>
    <span class="version-badge">v0.1.0</span>
  </div>

  <div class="header-center">
    <div class="view-mode-toggle">
      <button 
        type="button" 
        class="toggle-btn" 
        [ngClass]="{ 'active': activeView === 'table' }"
        (click)="setActiveView('table')">
        DiferenÃ§as
      </button>

      <button 
        type="button" 
        class="toggle-btn" 
        [ngClass]="{ 'active': activeView === 'diagram' }"
        (click)="setActiveView('diagram')">
        Diagrama ER
      </button>

      <button 
        type="button" 
        class="toggle-btn" 
        [ngClass]="{ 'active': activeView === 'impact' }"
        (click)="setActiveView('impact')">
        AnÃ¡lise de Risco & Impacto
      </button>

      <button 
        type="button" 
        class="toggle-btn" 
        [ngClass]="{ 'active': activeView === 'history' }"
        (click)="setActiveView('history')">
        HistÃ³rico & RelatÃ³rios
      </button>
    </div>
  </div>

  <div class="header-badges">
    <div class="readonly-badge">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      OperaÃ§Ã£o Somente Leitura
    </div>
  </div>
</header>

<!-- Layout Principal -->
<main class="app-workspace" [ngClass]="{ 'sidebar-collapsed': sidebarCollapsed }">
  <!-- Painel Lateral: ConfiguraÃ§Ãµes de ConexÃ£o -->
  <aside class="sidebar-deck" *ngIf="!sidebarCollapsed">
    <app-connection-panel
      side="source"
      [config]="source"
      [loading]="testingSource"
      (onTest)="testConnection('source')">
    </app-connection-panel>

    <app-connection-panel
      side="target"
      [config]="target"
      [loading]="testingTarget"
      (onTest)="testConnection('target')">
    </app-connection-panel>

    <button 
      type="button" 
      class="btn btn-primary run-comparison-btn" 
      [disabled]="comparing"
      (click)="runComparison()">
      <svg *ngIf="!comparing" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="1 4 1 10 7 10"></polyline>
        <polyline points="23 20 23 14 17 14"></polyline>
        <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path>
      </svg>
      <span *ngIf="comparing">Comparando Estruturas...</span>
      <span *ngIf="!comparing">Executar ComparaÃ§Ã£o Estrutural</span>
    </button>
  </aside>

  <!-- Ãrea de VisualizaÃ§Ã£o e Resultados -->
  <section class="main-viewport">
    <div class="view-panel" [style.display]="activeView === 'table' ? 'flex' : 'none'">
      <app-comparison-toolbar
        [(searchQuery)]="filterQuery"
        [(selectedCategory)]="selectedCategory"
        [diffCount]="filteredDiffs.length"
        (onExportSql)="exportSql()"
        (onExportJson)="exportJson()">
      </app-comparison-toolbar>

      <app-diff-results
        [diffs]="filteredDiffs"
        [hasRun]="hasRun"
        (onInspect)="onInspectObject($event)">
      </app-diff-results>
    </div>

    <div class="view-panel" [style.display]="activeView === 'diagram' ? 'flex' : 'none'">
      <app-er-diagram
        #erDiagram
        [diffs]="diffs"
        [sourceTables]="sourceTables"
        [targetTables]="targetTables"
        (onTableSelect)="onDiagramTableSelected($event)"
        (onOpenDiffs)="onDiagramOpenDiffs($event)">
      </app-er-diagram>
    </div>

    <div class="view-panel" [style.display]="activeView === 'impact' ? 'flex' : 'none'">
      <app-impact-dashboard
        [diffs]="diffs"
        (onNavigate)="onImpactNavigate($event)">
      </app-impact-dashboard>
    </div>

    <div class="view-panel" [style.display]="activeView === 'history' ? 'flex' : 'none'">
      <app-comparison-history
        (onRestore)="onRestoreSnapshot($event)">
      </app-comparison-history>
    </div>

    <!-- Painel Lateral/Inferior de InspeÃ§Ã£o Detalhada de Objetos -->
    <app-object-detail-panel
      [inspection]="activeInspection"
      (onClose)="activeInspection = null">
    </app-object-detail-panel>
  </section>
</main>

<!-- NotificaÃ§Ãµes Toast e DiÃ¡logos de ConfirmaÃ§Ã£o -->
<app-toast-container></app-toast-container>
<app-confirm-dialog></app-confirm-dialog>
