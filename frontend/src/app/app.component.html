<header class="app-header">
  <div class="brand-group">
    <svg class="brand-logo" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
      <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
      <line x1="12" y1="22.08" x2="12" y2="12"></line>
    </svg>
    <span class="brand-name">SchemaLens</span>
    <span class="version-badge">v0.1.0</span>
  </div>

  <nav class="header-center" aria-label="Visualizações">
    <div class="view-mode-toggle">
      <button type="button" class="toggle-btn" [ngClass]="{ 'active': activeView === 'table' }" (click)="setActiveView('table')">Diferenças</button>
      <button type="button" class="toggle-btn" [ngClass]="{ 'active': activeView === 'diagram' }" (click)="setActiveView('diagram')">Diagrama ER</button>
      <button type="button" class="toggle-btn" [ngClass]="{ 'active': activeView === 'impact' }" (click)="setActiveView('impact')">Análise de Risco &amp; Impacto</button>
      <button type="button" class="toggle-btn" [ngClass]="{ 'active': activeView === 'history' }" (click)="setActiveView('history')">Histórico &amp; Relatórios</button>
    </div>
  </nav>

  <div class="header-actions">
    <div class="readonly-badge">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      <span>Somente leitura</span>
    </div>
    <button #settingsButton type="button" class="settings-trigger" aria-label="Configurações de conexão" title="Configurações de conexão" [disabled]="comparing" (click)="openConnectionSettings()">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="m19.4 15 .1.1a1.7 1.7 0 0 1-2.4 2.4l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.2a1.7 1.7 0 0 1-3.4 0v-.2A1.7 1.7 0 0 0 7.8 17l-.1.1a1.7 1.7 0 1 1-2.4-2.4l.1-.1a1.7 1.7 0 0 0-1.2-2.9H4a1.7 1.7 0 0 1 0-3.4h.2A1.7 1.7 0 0 0 5.4 5.8l-.1-.1a1.7 1.7 0 1 1 2.4-2.4l.1.1a1.7 1.7 0 0 0 2.9-1.2V2a1.7 1.7 0 0 1 3.4 0v.2A1.7 1.7 0 0 0 17 3.4l.1-.1a1.7 1.7 0 1 1 2.4 2.4l-.1.1a1.7 1.7 0 0 0 1.2 2.9h.2a1.7 1.7 0 0 1 0 3.4h-.2a1.7 1.7 0 0 0-1.3 2.9Z"></path>
      </svg>
    </button>
    <button type="button" class="btn btn-primary header-compare" [disabled]="comparing" (click)="runComparison()">
      <span *ngIf="comparing">Comparando…</span>
      <span *ngIf="!comparing">Executar comparação</span>
    </button>
  </div>
</header>

<main class="app-workspace">
  <section class="main-viewport">
    <div class="view-panel" [style.display]="activeView === 'table' ? 'flex' : 'none'">
      <app-comparison-toolbar
        [(searchQuery)]="filterQuery"
        [(selectedCategory)]="selectedCategory"
        [diffCount]="filteredDiffs.length"
        (onExportSql)="exportSql()"
        (onExportJson)="exportJson()">
      </app-comparison-toolbar>
      <app-diff-results
        [diffs]="filteredDiffs"
        [hasRun]="hasRun"
        (onInspect)="onInspectObject($event)"
        (onExportSql)="exportIndividualSql($event)">
      </app-diff-results>
    </div>

    <div class="view-panel" [style.display]="activeView === 'diagram' ? 'flex' : 'none'">
      <app-er-diagram #erDiagram [diffs]="diffs" [sourceTables]="sourceTables" [targetTables]="targetTables"
        (onTableSelect)="onDiagramTableSelected($event)" (onOpenDiffs)="onDiagramOpenDiffs($event)">
      </app-er-diagram>
    </div>

    <div class="view-panel" [style.display]="activeView === 'impact' ? 'flex' : 'none'">
      <app-impact-dashboard [diffs]="diffs" (onNavigate)="onImpactNavigate($event)" (onExportSql)="exportRiskSql($event)">
      </app-impact-dashboard>
    </div>

    <div class="view-panel" [style.display]="activeView === 'history' ? 'flex' : 'none'">
      <app-comparison-history (onRestore)="onRestoreSnapshot($event)"></app-comparison-history>
    </div>

    <app-object-detail-panel [inspection]="activeInspection" (onClose)="activeInspection = null"></app-object-detail-panel>
  </section>
</main>

<app-connection-settings-modal
  [isOpen]="connectionSettingsOpen"
  [source]="source"
  [target]="target"
  [comparisonRunning]="comparing"
  (onClose)="closeConnectionSettings()"
  (onApplied)="applyConnectionSettings($event)">
</app-connection-settings-modal>
<app-toast-container></app-toast-container>
<app-confirm-dialog></app-confirm-dialog>
