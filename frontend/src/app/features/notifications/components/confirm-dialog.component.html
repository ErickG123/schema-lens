<div *ngIf="notificationService.activeConfirm()" class="modal-backdrop">
  <div 
    class="modal-card" 
    role="dialog" 
    aria-modal="true" 
    [attr.aria-labelledby]="'modal-title'">
    
    <div class="modal-header">
      <h3 id="modal-title" class="modal-title">
        {{ notificationService.activeConfirm()?.options?.title }}
      </h3>
    </div>

    <div class="modal-body">
      <p class="modal-message">
        {{ notificationService.activeConfirm()?.options?.message }}
      </p>
    </div>

    <div class="modal-footer">
      <button 
        type="button" 
        class="btn btn-secondary" 
        (click)="onCancel()">
        {{ notificationService.activeConfirm()?.options?.cancelLabel || 'Cancelar' }}
      </button>

      <button 
        type="button" 
        class="btn btn-primary" 
        (click)="onConfirm()">
        {{ notificationService.activeConfirm()?.options?.confirmLabel || 'Confirmar' }}
      </button>
    </div>
  </div>
</div>
